[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qgc"
version = "0.1.0"
description = "Clean-room reproduction of Troster (2018), 'Testing for Granger-causality in quantiles', Econometric Reviews 37(8), 850-866."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "scipy==1.15.2",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "statsmodels==0.14.4",   # ADF, KPSS, Granger-causality in mean, quantile regression
    "arch==7.2.0",           # AR(p)-GARCH(1,1) for the decision-F sigma sensitivity
    "PyYAML==6.0.3",
    "requests==2.32.3",
    "certifi==2025.4.26",
    "PyMuPDF==1.25.5",
    "tabulate==0.9.0",       # rasterises paper figures for curve digitisation (decision D)
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Spurious Apple Accelerate matmul warnings; see src/qgc/runtime/numerics.py for
# the evidence that results are bit-identical to a non-BLAS reference.
filterwarnings = [
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]
